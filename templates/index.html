<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>House Price Predictor</title>

<style>
body {
    font-family: Arial;
    background: #a857ea;
    margin: 0;
}

.container {
    width: 750px;
    margin: 70px auto;
    background: white;
    padding: 40px;
    border-radius: 20px;
}

h1 { text-align: center; }

.grid-4,
.grid-3 {
    display: grid;
    gap: 10px;
    margin-top: 15px;
    margin-bottom: 15px;
}

.grid-4 {
    grid-template-columns: repeat(4, 1fr);
}

.grid-3 {
    grid-template-columns: repeat(3, 1fr);
}

input,
select {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 8px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #a857ea;
    color: white;
    border: none;
    border-radius: 10px;
}

button:hover {
    background: #c081fd;
}

.reset-btn {
    background: #ccc;
    color: black;
}

.card {
    background: #f7f5ff;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.society-title {
    text-align: center;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏠 House Price Predictor</h1>

<form action="/predict" method="post">

<select name="city" required>
    <option disabled selected>Select City</option>
    <option value="Delhi">Delhi</option>
    <option value="Jaipur">Jaipur</option>
    <option value="Alwar">Alwar</option>
</select>

<div class="grid-4">
    <input name="area" type="number" placeholder="Area" min="500" max="30000" required>
    <input name="bedrooms" type="number" placeholder="Bedrooms" min="1" max="10" required>
    <input name="bathrooms" type="number" placeholder="Bathrooms" min="1" max="6" required>
    <input name="stories" type="number" placeholder="Stories" min="1" max="6" required>
</div>

<div class="grid-3">
    <select name="mainroad">
        <option disabled selected>Main Road</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <select name="guestroom">
        <option disabled selected>Guest Room</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <select name="basement">
        <option disabled selected>Basement</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>
</div>

<div class="grid-3">
    <select name="hotwaterheating">
        <option disabled selected>Hot Water Heating</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <select name="airconditioning">
        <option disabled selected>Air Conditioning</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <input type="number" name="parking" placeholder="Parking" min="0" max="6" required>
</div>

<div class="grid-3">
    <select name="prefarea">
        <option disabled selected>City Center</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <select name="furnishingstatus">
        <option disabled selected>Furnishing</option>
        <option value="furnished">Furnished</option>
        <option value="semi-furnished">Semi</option>
        <option value="unfurnished">Unfurnished</option>
    </select>
</div>

<button type="submit">Predict Price</button>
<button type="reset" class="reset-btn">Clear</button>

</form>

{% if prediction_text %}
<div class="society-title">
    Predicted Price: {{ prediction_text }}
</div>
{% endif %}

{% if societies %}
<h3 class="society-title">🏢 Societies</h3>

<div class="dashboard">
{% for s in societies %}
    <div class="card">
        <h3>{{ s.name }}</h3>
        <p>{{ s.city }}</p>
        <p>₹ {{ s.avg_price }}</p>
        <small>{{ s.facilities | join(', ') }}</small>
    </div>
{% endfor %}
</div>
{% endif %}

</div>

</body>
</html>
